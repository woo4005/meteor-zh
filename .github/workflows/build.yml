# Meteor-ZH 自动构建（build.yml）
#
# 触发：push 到 main、pull_request、workflow_dispatch 手动触发
# 环境：JDK 21（temurin）+ Gradle Wrapper（9.5.1）
#
# ⚠️ 映射说明：本工程源码使用 Mojang 官方映射名（mojmap），
# build.gradle 里是 `mappings loom.officialMojangMappings()`，不是 yarn。
# 不要按社区里 yarn 版 Meteor addon 模板来改这个 workflow / build.gradle，
# 否则 net.minecraft.commands.* / net.minecraft.network.chat.* 这些 import 会编译失败。
#
# 产物：build/libs/meteor-zh-<version>.jar（remapJar），上传为 CI artifact。
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Minecraft 1.21.11 / Fabric)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        # chmod：Windows 下创建的仓库可能没保留 gradlew 的可执行位
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Collect remapped jar
        # 只取映射后的 meteor-zh-<version>.jar，排除 *-dev.jar 与 *-sources.jar
        run: |
          mkdir -p out
          find build/libs -maxdepth 1 -name 'meteor-zh-*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp -v {} out/ \;
          ls -l out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteor-zh-jar
          path: out/*.jar
          if-no-files-found: error
