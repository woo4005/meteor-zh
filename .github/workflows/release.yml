# Meteor-ZH 自动发布（release.yml）
#
# ⚠️ 只支持**手动触发**（workflow_dispatch），不再由 push tag 自动触发。
#
# 为什么不用 push tags 自动触发：
#   1. 本仓库的发布由 scripts/build_261.py + scripts/github_sync.py 统一完成（含 26.1 线），
#      脚本会先创建 release 并上传 jar；若再由 workflow 自动发布一次，同名 asset 会 409 撞车。
#      （v1.4.2 就是这样红过一次的。）
#   2. 26.1 线（v1.5.x）根本不走 Gradle —— MC 26.x 换了一套构建环境（见 README「26.1 线的两个坑」），
#      由 scripts/build_261.py 离线构建。自动触发必然在「tag ≠ mod_version」这一步失败。
#
# 两条版本线的分工：
#   v1.4.x  -> Minecraft 1.21.11 线，本 Gradle 工程的构建目标，本 workflow 可手动构建并发布
#   v1.5.x  -> Minecraft 26.1 线，不走 Gradle，用 scripts/build_261.py 构建、github_sync.py 上传
#
# ⚠️ 映射说明：本工程源码使用 Mojang 官方映射名（mojmap），
# build.gradle 里是 `mappings loom.officialMojangMappings()`，不是 yarn。
# 不要按社区里 yarn 版 Meteor addon 模板来改这个 workflow / build.gradle。
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签，例如 v1.4.3（必须与 gradle.properties 的 mod_version 一致）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：generate_release_notes 需要根据上一个 tag 生成变更记录
          fetch-depth: 0

      - name: Check tag matches mod_version
        # 标签版本和 gradle.properties 的 mod_version 不一致时直接失败，
        # 避免出现「tag 是 v1.4.3、jar 却是 meteor-zh-1.4.2.jar」的发布事故
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="${INPUT_TAG#v}"
          echo "input_tag=${INPUT_TAG}  tag=${TAG}  mod_version=${VERSION}"
          if [ -z "${TAG}" ]; then
            echo "::error::没有提供 tag"
            exit 1
          fi
          if [ "${TAG}" != "${VERSION}" ]; then
            echo "::error::tag ${TAG} 与 gradle.properties 的 mod_version ${VERSION} 不一致"
            exit 1
          fi
          case "${TAG}" in
            1.4.*) echo "OK: 1.21.11 线" ;;
            *) echo "::error::本 workflow 只处理 1.4.x（1.21.11 线），26.1 线请用 scripts/build_261.py"; exit 1 ;;
          esac

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        # chmod：Windows 下创建的仓库可能没保留 gradlew 的可执行位
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Collect remapped jar
        # 只取映射后的 meteor-zh-<version>.jar，排除 *-dev.jar 与 *-sources.jar
        run: |
          mkdir -p out
          find build/libs -maxdepth 1 -name 'meteor-zh-*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp -v {} out/ \;
          ls -l out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: out/*.jar
          fail_on_unmatched_files: true
          # 同名 asset 已存在时覆盖，避免与 scripts/github_sync.py 的产物撞车
          overwrite_files: true
          generate_release_notes: true
