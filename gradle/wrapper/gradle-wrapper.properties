# =====================================================================
# Gradle Wrapper 配置 —— Meteor-ZH（meteor-zh）
#
# 为什么是 9.5.1 而不是 8.x：
#   Fabric Loom 1.16 release notes 明确写了 "Update minimum Gradle version to 9.4"，
#   本工程用的 Loom 1.17.19 继承这条约束，并且 Loom 自己也是用 Gradle 9.5 自举的。
#   所以 distributionUrl 写 gradle-8.12-bin.zip 会在插件加载阶段被 Loom 直接拒绝
#   （构建根本到不了编译步骤）。要降 Gradle 版本就必须同步把 Loom 降到 1.15 或更低，
#   那会丢掉 1.21.11 的官方支持 —— 不要这么干。
#
# 首次使用：在有网环境执行一次 ./gradlew build（Windows: gradlew.bat build），
#   会自动下载 Gradle 9.5.1 到 ~/.gradle/wrapper/dists/。
#   CI 环境（.github/workflows/build.yml）由 GitHub Actions 联网下载。
# =====================================================================
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
