# =====================================================================
# Meteor-ZH（meteor-zh）Gradle 属性
# 映射注意：本工程是 mojmap（loom.officialMojangMappings()），不是 yarn。
# =====================================================================

# ---------- Gradle 自身 ----------
# loom 解析 Minecraft + 重映射 Meteor 的 jar 比较吃内存：CI 上给 3G，别低于 2G
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# loom 已知 issue #1349：与配置缓存不兼容，官方示例也关掉，别改回 true
org.gradle.configuration-cache=false

# ---------- 本 addon ----------
# 三条线共用一份源码、各自独立编号：
#   mod_version      -> 1.21.11 线（meteor-zh-<版本>-mc1.21.11.jar，Gradle 与 build.py 都用它）
#   mod_version_261  -> 26.1 线   （meteor-zh-<版本>-mc26.1.x.jar，build_261.py 用它）
#   mod_version_262  -> 26.2 线   （meteor-zh-<版本>-mc26.2.jar，build_262.py 用它）
# 这些值是版本号的唯一来源：构建脚本从这里读，不允许再在 .py 里手写一份。
#
# 版本规则（2026-11 起，见 README「版本规则」）：
#   X.Y.Z        功能版本 / 新 MC 版本适配
#   X.Y.Z.NNN    维护期补丁，NNN 从 001 递增，只修 Bug 与漏洞
# 1.5.8 / 1.4.8 是各自线的最后一个功能版本，之后只发 1.5.8.NNN / 1.4.8.NNN。
mod_version=1.4.8
mod_version_261=1.5.8
mod_version_262=2.0.0
maven_group=com.meteorzh
# 产物前缀（base.archivesName），固定 meteor-zh-<version>.jar
archives_base_name=meteor-zh

# ---------- 依赖表达式的唯一来源 ----------
# 源 fabric.mod.json / meteor-zh.mixins.json 只写占位符，两条构建各自展开
# （Gradle 走 processResources.expand，离线脚本走 build.py / build_261.py 的 expand()）。
minecraft_version=1.21.11
java_level=21
java_level_261=25
java_level_262=25
mixin_compatibility_level=JAVA_21

# ---------- 依赖版本（钉选值集中记录，实际写在各处，改时记得对账） ----------
# Minecraft 1.21.11              -> build.gradle: minecraft "com.mojang:minecraft:1.21.11"
# Fabric Loader 0.19.3           -> build.gradle: modImplementation "net.fabricmc:fabric-loader:0.19.3"
# Fabric Loom 1.17.19            -> build.gradle: plugins 里的插件版本
# Meteor Client 1.21.11-SNAPSHOT -> build.gradle: modImplementation "meteordevelopment:meteor-client:1.21.11-SNAPSHOT"
# Gradle 9.5.1                   -> gradle/wrapper/gradle-wrapper.properties
# 要求：fabric.mod.json 的 depends.minecraft 当前写 "~1.21.11"，源码也是按 1.21.11 的 mojmap 写的
