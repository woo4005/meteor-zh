# =====================================================================
# Meteor-ZH（meteor-zh）Gradle 属性
# 映射注意：本工程是 mojmap（loom.officialMojangMappings()），不是 yarn。
# =====================================================================

# ---------- Gradle 自身 ----------
# loom 解析 Minecraft + 重映射 Meteor 的 jar 比较吃内存：CI 上给 3G，别低于 2G
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# loom 已知 issue #1349：与配置缓存不兼容，官方示例也关掉，别改回 true
org.gradle.configuration-cache=false

# ---------- 本 addon ----------
# 发布版本唯一来源：产物名 meteor-zh-<mod_version>.jar，
# fabric.mod.json 的 "version": "${version}" 也在构建期由它展开。
mod_version=1.4.0
maven_group=com.meteorzh
# 产物前缀（base.archivesName），固定 meteor-zh-<version>.jar
archives_base_name=meteor-zh

# ---------- 依赖版本（钉选值集中记录，实际写在各处，改时记得对账） ----------
# Minecraft 1.21.11              -> build.gradle: minecraft "com.mojang:minecraft:1.21.11"
# Fabric Loader 0.19.3           -> build.gradle: modImplementation "net.fabricmc:fabric-loader:0.19.3"
# Fabric Loom 1.17.19            -> build.gradle: plugins 里的插件版本
# Meteor Client 1.21.11-SNAPSHOT -> build.gradle: modImplementation "meteordevelopment:meteor-client:1.21.11-SNAPSHOT"
# Gradle 9.5.1                   -> gradle/wrapper/gradle-wrapper.properties
# 要求：fabric.mod.json 的 depends.minecraft 当前写 "~1.21.11"，源码也是按 1.21.11 的 mojmap 写的
